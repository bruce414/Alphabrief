[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphabrief-backend"
version = "0.3.0"
description = "AlphaBrief API (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    "email-validator>=2.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "trafilatura>=2.0",
    "youtube-transcript-api>=0.6",
    "anthropic>=0.40",
    "bleach>=6.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
